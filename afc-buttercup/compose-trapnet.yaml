# TrapNet-CRS local compose - replaces scantron with mock competition API
# Usage: docker compose -f compose-trapnet.yaml up -d

name: "trapnet-crs"

x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    tag: "{{.Name}}|{{.ImageName}}|{{.ID}}"

x-env: &common-env
  NODE_DATA_DIR: /node_data
  DOCKER_HOST: tcp://dind:2375
  BUTTERCUP_LITELLM_KEY: sk-1234
  BUTTERCUP_LITELLM_HOSTNAME: http://litellm:8080
  BUTTERCUP_DOWNLOADER_SERVE__REDIS_URL: redis://redis:6379
  BUTTERCUP_DOWNLOADER_LOG_LEVEL: debug
  BUTTERCUP_DOWNLOADER_DOWNLOAD_DIR: /node_data/tasks_storage
  BUTTERCUP_DOWNLOADER_SERVE__SLEEP_TIME: 5
  BUTTERCUP_TASK_SERVER_REDIS_URL: redis://redis:6379
  BUTTERCUP_TASK_SERVER_LOG_LEVEL: debug
  BUTTERCUP_TASK_SERVER_HOST: "0.0.0.0"
  BUTTERCUP_TASK_SERVER_PORT: "8000"
  BUTTERCUP_TASK_SERVER_API_KEY_ID: "515cc8a0-3019-4c9f-8c1c-72d0b54ae561"
  BUTTERCUP_TASK_SERVER_COMPETITION_API_URL: http://mock-competition-api:8080
  BUTTERCUP_TASK_SERVER_COMPETITION_API_USERNAME: "11111111-1111-1111-1111-111111111111"
  BUTTERCUP_TASK_SERVER_COMPETITION_API_PASSWORD: secret
  COMPETITION_API_KEY_ID: "11111111-1111-1111-1111-111111111111"
  COMPETITION_API_KEY_TOKEN: secret
  BUTTERCUP_SCHEDULER_SERVE__REDIS_URL: redis://redis:6379
  BUTTERCUP_SCHEDULER_LOG_LEVEL: debug
  BUTTERCUP_SCHEDULER_SERVE__SLEEP_TIME: 5
  BUTTERCUP_SCHEDULER_SERVE__COMPETITION_API_URL: http://mock-competition-api:8080
  BUTTERCUP_SCHEDULER_TASKS_STORAGE_DIR: /node_data/tasks_storage
  BUTTERCUP_SCHEDULER_SCRATCH_DIR: /node_data/crs_scratch
  BUTTERCUP_PATCHER_SERVE__REDIS_URL: redis://redis:6379
  BUTTERCUP_PATCHER_SERVE__SLEEP_TIME: 5
  BUTTERCUP_PATCHER_LOG_LEVEL: debug
  BUTTERCUP_PATCHER_TASK_STORAGE_DIR: /node_data/crs_scratch
  BUTTERCUP_PATCHER_SCRATCH_DIR: /node_data/crs_scratch
  BUTTERCUP_PROGRAM_MODEL_SERVE__REDIS_URL: redis://redis:6379
  BUTTERCUP_PROGRAM_MODEL_SERVE__SLEEP_TIME: 5
  BUTTERCUP_PROGRAM_MODEL_LOG_LEVEL: debug
  BUTTERCUP_PROGRAM_MODEL_SCRATCH_DIR: /node_data/crs_scratch
  BUTTERCUP_PROGRAM_MODEL_GRAPHDB_ENABLED: "false"
  BUTTERCUP_FUZZER_WDIR: /node_data/crs_scratch
  BUTTERCUP_FUZZER_SAMPLE_SIZE: "200"
  BUTTERCUP_FUZZER_LOG_LEVEL: debug
  BUTTERCUP_FUZZER_MAX_POV_SIZE: "2097152"
  BUTTERCUP_SEED_GEN_LOG_LEVEL: debug
  BUTTERCUP_SEED_GEN_SERVER__REDIS_URL: redis://redis:6379
  BUTTERCUP_SEED_GEN_WDIR: /node_data/crs_scratch
  BUTTERCUP_SEED_GEN_SERVER__SLEEP_TIME: 5
  BUTTERCUP_SEED_GEN_SERVER__CRASH_DIR_COUNT_LIMIT: "100"
  BUTTERCUP_SEED_GEN_SERVER__MAX_CORPUS_SEED_SIZE: "65536"
  BUTTERCUP_SEED_GEN_SERVER__MAX_POV_SIZE: "2097152"
  BUILD_TASK_TIMEOUT_MS: "120000"
  BUILD_OUTPUT_TASK_TIMEOUT_MS: "120000"
  DOWNLOAD_TASK_TIMEOUT_MS: "120000"
  READY_TASK_TIMEOUT_MS: "120000"
  DELETE_TASK_TIMEOUT_MS: "120000"
  CRASH_TASK_TIMEOUT_MS: "120000"
  PATCH_TASK_TIMEOUT_MS: "120000"
  CONFIRMED_VULNERABILITIES_TASK_TIMEOUT_MS: "120000"
  INDEX_TASK_TIMEOUT_MS: "120000"
  INDEX_OUTPUT_TASK_TIMEOUT_MS: "120000"
  TRACED_VULNERABILITIES_TASK_TIMEOUT_MS: "120000"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_PROTOCOL: http
  OSS_FUZZ_CONTAINER_ORG: aixcc-afc

services:
  redis:
    image: redis:7.4.2
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    logging: *logging

  dind:
    image: docker:24-dind
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false", "--storage-driver=overlay2"]
    restart: always
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR
    volumes:
      - type: bind
        source: ./crs_scratch
        target: /crs_scratch
      - shared-tmp:/tmp
      - ./node_data_storage/:/node_data
    logging: *logging

  litellm:
    image: ghcr.io/berriai/litellm:litellm_stable_release_branch-v1.57.8-stable
    configs:
      - source: litellm_config
        target: /app/config.yaml
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgresql://litellm_user:litellm_password11@litellm-db:5432/litellm"
    command: ["--config", "/app/config.yaml", "--port", "8080", "--num_workers", "8"]
    depends_on:
      litellm-db:
        condition: service_healthy
    logging: *logging

  litellm-db:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm_user
      POSTGRES_PASSWORD: litellm_password11
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  mock-competition-api:
    build:
      context: .
      dockerfile: ./orchestrator/Dockerfile
    command: ["python", "-m", "buttercup.orchestrator.mock_competition_api",
              "--host", "0.0.0.0", "--port", "8080",
              "--crs-url", "http://task-server:8000/v1/task/",
              "--crs-key-id", "515cc8a0-3019-4c9f-8c1c-72d0b54ae561",
              "--crs-token", "REDACTED_CRS_TOKEN",
              "--crs-enabled",
              "--base-url", "http://mock-competition-api:8080"]
    ports:
      - "0.0.0.0:31323:8080"
    env_file: env.dev.compose
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./node_data_storage/:/node_data
      - shared-tmp:/tmp
    depends_on:
      task-server:
        condition: service_started
    logging: *logging

  task-downloader:
    build:
      context: .
      dockerfile: ./orchestrator/Dockerfile
    command: ["buttercup-task-downloader", "serve"]
    volumes:
      - ./tasks_storage:/tasks_storage
      - ./node_data_storage/:/node_data
    env_file: env.dev.compose
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  task-server:
    build:
      context: .
      dockerfile: ./orchestrator/Dockerfile
    command: ["buttercup-task-server"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file: env.dev.compose
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  scheduler:
    build:
      context: .
      dockerfile: ./orchestrator/Dockerfile
    command: ["buttercup-scheduler", "serve"]
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./tasks_storage:/tasks_storage
      - ./node_data_storage/:/node_data
    env_file: env.dev.compose
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  coverage-bot:
    command: ["buttercup-coverage-bot", "--wdir", "/node_data/crs_scratch", "--redis_url", "redis://redis:6379"]
    build:
      context: ./
      dockerfile: ./fuzzer/dockerfiles/runner_image_trapnet.Dockerfile
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./tasks_storage:/tasks_storage
      - ./node_data_storage/:/node_data
    env_file: env.dev.compose
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_started
    logging: *logging

  build-bot:
    command: ["buttercup-fuzzer-builder", "--wdir", "/node_data/crs_scratch", "--redis_url", "redis://redis:6379", "--timer", "5000"]
    build:
      context: ./
      dockerfile: ./fuzzer/dockerfiles/runner_image_trapnet.Dockerfile
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./tasks_storage:/tasks_storage
      - ./node_data_storage/:/node_data
    env_file: env.dev.compose
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_started
    logging: *logging

  tracer-bot:
    command: ["buttercup-tracer-bot", "--wdir", "/node_data/crs_scratch", "--redis_url", "redis://redis:6379"]
    build:
      context: ./
      dockerfile: ./fuzzer/dockerfiles/runner_image_trapnet.Dockerfile
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./tasks_storage:/tasks_storage
      - ./node_data_storage/:/node_data
    env_file: env.dev.compose
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_started
    logging: *logging

  fuzzer-bot:
    build:
      context: ./
      dockerfile: ./fuzzer/dockerfiles/runner_image_trapnet.Dockerfile
    command: ["buttercup-fuzzer", "--crs_scratch_dir", "/node_data/crs_scratch", "--redis_url", "redis://redis:6379", "--timeout", "900", "--timer", "5000", "--crash_dir_count_limit", "100"]
    env_file: env.dev.compose
    environment:
      <<: *common-env
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./node_data_storage/:/node_data
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  program-model:
    build:
      context: ./
      dockerfile: ./program-model/Dockerfile.trapnet
    command: ["buttercup-program-model", "serve"]
    env_file: env.dev.compose
    environment:
      <<: *common-env
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./tasks_storage:/tasks_storage
      - ./node_data_storage/:/node_data
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_started
    logging: *logging

  seed-gen:
    build:
      context: .
      dockerfile: ./seed-gen/Dockerfile.trapnet
    command: ["seed-gen", "server"]
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./node_data_storage/:/node_data
    env_file: env.dev.compose
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
      dind:
        condition: service_started
    logging: *logging

  patcher:
    build:
      context: .
      dockerfile: ./patcher/Dockerfile.trapnet
    command: ["buttercup-patcher", "serve"]
    volumes:
      - ./crs_scratch:/crs_scratch
      - ./node_data_storage/:/node_data
    env_file: env.dev.compose
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_started
    logging: *logging

configs:
  litellm_config:
    file: ./litellm/litellm_config.yaml

volumes:
  shared-tmp:
